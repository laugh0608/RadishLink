name: 变更提案
description: 提议产品、架构、协议、安全、硬件、法规或治理变化
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        提案用于澄清问题、证据和停止线，不代表方案已经接受。安全漏洞请使用 SECURITY.md 中的私密渠道。
  - type: dropdown
    id: area
    attributes:
      label: 主要领域
      options:
        - 产品与用户场景
        - 系统或硬件架构
        - 无线承载、路由与 QoS
        - 身份、端到端加密与升级
        - 公共协议与兼容性
        - 射频法规与测试
        - 手机伴侣接入
        - 仓库治理与 CI
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与目标
      description: 说明要解决的问题、用户价值和明确非目标。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前基线
      description: 指向相关状态文档、ADR、协议或已有实测，区分已确定事实与候选。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: 描述边界、接口、兼容性、迁移和失败模式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与权衡
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与验证计划
      description: 标明厂商声明、标准目标、第三方结果或 RadishLink 实测，并给出可复现条件与通过标准。
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 停止线确认
      options:
        - label: 我没有把候选、目标或外部声明写成已验证能力
          required: true
        - label: 若涉及射频、安全、密钥、升级、公共协议或用户数据，我已显式说明影响
          required: true
        - label: 我没有附带真实秘密、私密通信或无法确认授权的材料
          required: true
