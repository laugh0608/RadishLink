[package]
name = "radishlink-sw-g2-openmls-spike"
version = "0.0.0"
edition = "2021"
publish = false
license-file = "../../../LICENSE"

[dependencies]
openmls = { version = "=0.8.1", features = ["fork-resolution"] }
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_sqlite_storage = "=0.2.0"
openmls_traits = "=0.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tls_codec = "=0.4.2"

[dev-dependencies]
tempfile = "=3.27.0"
