[package]
name = "radishlink-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license-file = "../LICENSE"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[[bin]]
name = "radishlink-node"
path = "src/bin/node.rs"

[[bin]]
name = "radishlinkctl"
path = "src/bin/ctl.rs"
